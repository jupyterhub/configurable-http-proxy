# This is a GitHub workflow defining a set of jobs with a set of steps.
# ref: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
name: Test

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/workflows/*"
      - "!.github/workflows/publish.yml"
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/*"
      - "!.github/workflows/publish.yml"
    branches-ignore:
      - "dependabot/**"
      - "pre-commit-ci-update-config"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  # Audit dependencies for known vulnerabilities
  audit-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Action Repo: https://github.com/actions/cache
      - name: "Cache node_modules"
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: "Install dependencies (npm ci)"
        run: |
          npm ci

      - name: npm audit
        run: |
          # If this fails, run `npm audit fix`
          npm audit --omit=dev --audit-level=moderate

  test:
    runs-on: ubuntu-24.04
    # Redis service so the RedisStore tests run; REDIS_URL is set below.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    strategy:
      fail-fast: false # Do not cancel all jobs if one fails
      matrix:
        # IMPORTANT: Make sure to update package.json's engines.node field to
        #            always require at least the oldest version, as well as our
        #            README.md file under the install section.
        node_version:
          # ubuntu 24.04: 18
          # debian 13: 20
          # 20 LTS EOL: 2026-06
          - "20"
          - "22"
          - "24"
          - current

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      # Action Repo: https://github.com/actions/cache
      - name: "Cache node_modules"
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: setup internal ssl
        run: |
          pipx run test/make_internal_ssl.py

      - name: "Install dependencies (npm ci)"
        run: |
          npm ci

      # The c8 coverage tool (via its bundled yargs@17) does not yet load on the
      # bleeding-edge "current" Node release, so run tests without coverage there.
      # Coverage is still collected on the stable versions.
      - name: "Run tests"
        run: |
          if [ "${{ matrix.node_version }}" = "current" ]; then
            npm run test:no-coverage
          else
            npm test
          fi

      # Action Repo: https://github.com/codecov/codecov-action
      - name: "Upload coverage to codecov"
        if: matrix.node_version != 'current'
        uses: codecov/codecov-action@v6
